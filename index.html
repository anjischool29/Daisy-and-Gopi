<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daisy's Corner</title>
  
  <link rel="stylesheet" href="homepagestyle.css">
</head>
<body>

  <div class="site-container">

    <h1>Welcome to Daisy's Website!</h1>
    <p class="subtitle">A cute photo gallery and story about the best dog, Daisy.</p>

    <h2>Daisy's Photo Gallery</h2>

    <!-- REQUIRED IMAGE 1 (Using your requested image command structure) -->
    <!-- CHANGE "daisy-playing.jpg" TO YOUR ACTUAL IMAGE FILENAME -->
    <img class="iteming" src="daisy-playing.jpg" alt="Daisy playing in the yard">

    <!-- REQUIRED IMAGE 2 -->
    <!-- CHANGE "daisy-sleeping.jpg" TO YOUR ACTUAL IMAGE FILENAME -->
    <img class="iteming" src="daisy-sleeping.jpg" alt="Daisy sleeping peacefully">

    <!-- SIMPLE CUTENESS RATER BUTTON -->
    <div class="rater-box">
      <button onclick="rateDaisy()">Rate Daisy's Cuteness!</button>
      <p id="rating-text"></p>
    </div>

    <!-- REQUIRED LINK TO ANOTHER WEBPAGE (Using your requested clickable div command) -->
    <!-- CHANGE 'about.html' TO THE WEBPAGE FILE OR URL YOU WANT TO OPEN -->
    <div class="name" onclick="location.href='about.html'">
      Click here to read Daisy's full story & favorite treats! ➔
    </div>

  </div>

  <!-- SIMPLE JAVASCRIPT FOR THE CUTENESS RATER BUTTON -->
  <script>
    function rateDaisy() {
      document.getElementById("rating-text").innerText = "Rating: 1000/10! Absolute perfection!";
    }
  </script>

</body>
</html>
